{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modification d'une demande de trajet</title>
    <link rel="stylesheet" href="{% static 'trajets/css/modifier_demande_trajet.css' %}">
</head>
<body>

    <div class="message-container">
        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}
    </div>
    
    <div class="container">
        <h1>Détail d'un trajet</h1>
        <h2>Modifiez votre demande de trajet</h2>

        <form class="formulaire" method="get" action="{% url 'modifier_demande_trajet' demande.id %}">
            {% csrf_token %}

            <label for="depart">Quelle est votre point de depart?</label>
            <input type="text" id="depart" name="depart" required>

            <label for="destination">Quelle est votre destination ?</label>
            <input type="text" id="destination" name="destination" required>

            <label for="date">Date :</label>
            <input type="date" id="date" name="date" required>

            <label for="heure">Heure de départ :</label>
            <input type="time" id="heure" name="heure" required>
            
            <button type="submit">Soumettre</button>
            
        </form>

       
    </div>
</body>
</html>
