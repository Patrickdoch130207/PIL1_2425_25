{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma page d'inscription</title>
    <link rel="stylesheet" href="{% static 'users/css/connexion.css' %}">
</head>
<body>
    <div class="message-container">
        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}
    </div>
    
    <div class="page">
        <h1>Bienvenue sur GoVibe</h1>
        <form> 
            <input type="e-mail" placeholder="Adresse e-mail" name="email" required>
            <input type="password" placeholder="Mot de passe" name="password" required>
            <a href="{% url 'send_reset_code'}"><br>Mot de passe oublié ?<br></a>
            <button type="submit">Connexion</button>
             
            <p>Vous n'avez pas de compte ?<a href="{% url 'inscription' %}">  S'inscrire</a></p>
        </form>
    </div>
</body>
</html>
