{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposer un trajet</title>
    <link rel="stylesheet" href="{% static 'users/css/dashboard.css' %}">
</head>
<body>
    <div class="container">
        <h1>Détail d'un trajet</h1>
        <h2>Proposer un trajet</h2>

        <form class="formulaire">
            <label for="destination">Quelle est votre destination ?</label>
            <input type="text" id="destination" name="destination">

            <label for="date">Date :</label>
            <input type="date" id="date" name="date">

            <label for="heure">Heure de départ :</label>
            <input type="time" id="heure" name="heure">

            <label for="places">Nombre de places disponibles :</label>
            <input type="number" id="places" name="places" min="1">
            <a href="#" class="lien-soumettre">Soumettre</a>
            
        </form>

       
    </div>
</body>
</html>
